name: Refresh RAR Dashboard

on:
  schedule:
    # 週一到週五，台北 08:17 到 19:17 每小時一次 (UTC 00:17-11:17)。避開整點，GitHub 排程較準。
    - cron: '17 0-11 * * 1-5'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/refresh-dashboard.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JIRA_SITE: mobiledrivetech.atlassian.net
      JIRA_JQL: 'filter=12811 ORDER BY key ASC'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch RAR issues from Jira
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python scripts/fetch_jira.py

      - name: Build site/index.html
        run: python scripts/build_dashboard.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
