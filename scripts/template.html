<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAR Issue Tracker</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1f2328;--mute:#656d76;--line:#d8dee4;--blue:#0969da;--btn:#4b5b5b;--btn2:#d5e5ea;
        --new:#6e7781;--prog:#bf8700;--done:#1a7f37;--err:#cf222e}
  @media (prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#161b22;--ink:#e6edf3;--mute:#8d96a0;--line:#30363d;--blue:#4493f8;--btn:#6b7d7d;--btn2:#2b3a40;--new:#8d96a0;--prog:#d29922;--done:#3fb950;--err:#f85149}}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink)}
  main{max-width:1200px;margin:0 auto;padding:16px 16px 32px}
  .top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
  .tools{display:flex;gap:8px;flex-wrap:wrap}
  .tbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 14px;cursor:pointer;font-size:14px}
  .tbtn:hover{border-color:var(--blue)} .tbtn:disabled{opacity:.5;cursor:default}
  .tbtn.ok{border-color:var(--done)}
  h1{font-size:22px;margin:0}
  .sub{color:var(--mute);font-size:12px;margin:4px 0} .sub a{color:var(--blue)}
  .updated{font-size:13px;margin:0 0 16px} .updated b{font-variant-numeric:tabular-nums}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 16px}
  .kpi b{display:block;font-size:26px} .kpi span{color:var(--mute);font-size:12px}
  .kpi.click{cursor:pointer;transition:border-color .15s,box-shadow .15s}
  .kpi.click:hover{border-color:var(--blue)}
  .kpi.on{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue) inset}
  .kpis.proj{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
  .kpi .sub2{display:block;color:var(--mute);font-size:11px;margin-top:2px}
  .cbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:2px 8px;cursor:pointer;font-size:12px;white-space:nowrap}
  .cbtn:hover{border-color:var(--blue)}
  dialog.cm{width:min(820px,96vw);max-height:90vh;overflow:auto}
  .cmhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:4px 0 12px}
  .tabs button{border:0;background:none;color:var(--mute);padding:8px 14px;cursor:pointer;font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tabs button.on{color:var(--ink);border-bottom-color:var(--blue);font-weight:600}
  .badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:99px;background:var(--err);color:#fff;font-size:12px;text-align:center}
  .badge.zero{background:var(--line);color:var(--mute)}
  .todoinfo{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--err);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:8px}
  .todohint{font-size:12px;color:var(--err);margin-top:2px}
  td.asg{font-size:13px;white-space:nowrap}
  .cmlist{margin:8px 0 12px;display:flex;flex-direction:column;gap:8px}
  .cmitem{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  .cmitem .meta{font-size:12px;color:var(--mute);display:flex;gap:8px;align-items:center}
  .cmitem .meta b{color:var(--ink)} .cmitem .del{margin-left:auto;border:0;background:none;color:var(--mute);cursor:pointer;font-size:12px}
  .cmitem .txt{white-space:pre-wrap;word-break:break-word;margin-top:4px;font-size:14px}
  .cmform input,.cmform textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;margin-top:6px}
  .cbtn.has{border-color:var(--blue);color:var(--blue)}
  .cmhead b{font-size:15px} .cmhead .x{border:0;background:none;font-size:20px;cursor:pointer;color:var(--mute)}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  input[type=search],input[type=password]{flex:1;min-width:220px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:14px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 10px;cursor:pointer;font-size:12px}
  .chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .tablewrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{font-size:12px;color:var(--mute);cursor:pointer;user-select:none;white-space:nowrap}
  td a{color:var(--blue);text-decoration:none;white-space:nowrap} td a:hover{text-decoration:underline}
  .st{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;white-space:nowrap;border:1px solid currentColor}
  .new{color:var(--new)} .indeterminate{color:var(--prog)} .done{color:var(--done)}
  .count{color:var(--mute);font-size:12px;margin:8px 0}
  .st.stla{color:var(--blue)} td.spec{font-size:12px;max-width:220px}
  .dash{color:var(--mute)}
  .prog{display:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:16px}
  .prog.show{display:block}
  .track{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
  .fill{height:100%;width:0;background:var(--blue);transition:width .6s}
  .prog.err .fill{background:var(--err)} .prog.ok .fill{background:var(--done)}
  .prog .msg{font-size:13px;display:flex;justify-content:space-between;gap:8px}
  .prog.err .msg{color:var(--err)}
  dialog{border:0;border-radius:12px;padding:20px;width:min(480px,92vw);background:var(--card);color:var(--ink);box-shadow:0 8px 30px rgba(0,0,0,.25)}
  dialog::backdrop{background:rgba(0,0,0,.35)}
  dialog p{margin:0 0 12px;font-size:14px} dialog a{color:var(--blue)}
  dialog input{width:100%}
  .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap}
  .b1{background:var(--btn);color:#fff;border:0;border-radius:999px;padding:8px 20px;cursor:pointer;font-size:14px}
  .b2{background:var(--btn2);color:var(--ink);border:0;border-radius:999px;padding:8px 20px;cursor:pointer;font-size:14px}
  .hint{color:var(--mute);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>RAR Issue Tracker</h1>
    <div class="tools">
      <button class="tbtn" id="btnToken">🔑 <span data-i="token"></span></button>
      <button class="tbtn" id="btnUpdate">⟳ <span data-i="update"></span></button>
      <button class="tbtn" id="btnStla">⬆ <span data-i="stlaUp"></span></button>
      <input type="file" id="stlaFile" accept=".csv,.txt,.tsv,.xlsx,.xls" style="display:none">
      <button class="tbtn" id="btnLang">EN</button>
    </div>
  </div>
  <div class="sub" id="sub"></div>
  <div class="updated"><span data-i="lastUpdated"></span> <b id="updatedAt">—</b></div>
  <div class="prog" id="prog">
    <div class="msg"><span id="progMsg"></span><span id="progPct">0%</span></div>
    <div class="track"><div class="fill" id="progFill"></div></div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="kpis proj" id="projs"></div>
  <div class="tabs" id="tabs"><button data-tab="all"></button><button data-tab="pm"></button><button data-tab="rd"></button></div>
  <div class="bar"><input type="search" id="q"></div>
  <div class="bar" id="chips"></div>
  <div class="todoinfo" id="todoInfo" style="display:none"></div>
  <div class="count" id="count"></div>
  <div class="tablewrap"><table>
    <thead><tr><th data-k="key" data-i="colKey"></th><th data-k="summary" data-i="colSummary"></th><th data-k="status" data-i="colStatus"></th><th data-k="assignee" data-i="colAsg"></th><th data-k="extId" data-i="colExt"></th><th data-k="stla" data-i="colStla"></th><th data-k="spec" data-i="colSpec"></th><th data-i="colCmt"></th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
</main>

<dialog id="dlgToken">
  <p data-html="tokenPrompt"></p>
  <input type="password" id="tokenInput" autocomplete="off" placeholder="github_pat_...">
  <div class="hint" id="tokenState"></div>
  <div class="actions">
    <button class="b2" id="tokenClear" data-i="clear"></button>
    <button class="b2" id="tokenCancel" data-i="cancel"></button>
    <button class="b1" id="tokenOk" data-i="ok"></button>
  </div>
</dialog>

<dialog id="dlgCmt" class="cm">
  <div class="cmhead"><div><b id="cmKey"></b><div class="hint" id="cmSum"></div></div><button class="x" id="cmClose" aria-label="close">×</button></div>
  <div id="cmList" class="cmlist"></div>
  <div class="cmform">
    <input type="text" id="cmName" maxlength="40" autocomplete="name">
    <textarea id="cmText" rows="3" maxlength="2000"></textarea>
    <div class="actions" style="margin-top:8px"><span class="hint" id="cmMsg" style="margin-right:auto"></span><button class="b1" id="cmSend" data-i="send"></button></div>
  </div>
</dialog>

<script>
const DATA = /*__DATA__*/null;
const GH_REPO='marzlo/RAR', GH_WF='refresh-dashboard.yml', TOKEN_KEY='rar-gh-token', FILTER='12811';
const PROJECTS=['NR1L','NR1LD'];
/* PM / RD to-do: STLA has answered (Solution Proposed / RAR Rejected) while Jira is still in progress */
const TODO_RULE={
  stla:['solution proposed','rar rejected'],
  jira:{NR1LD:['md in progress'],NR1L:['in progress']},
  pm:['joseph','amanda','leyo','lynn','book']     // assignee name starts with one of these = already with a PM
};
const isPM=a=>{const n=String(a||'').trim().toLowerCase();return !!n&&TODO_RULE.pm.some(p=>n.startsWith(p))};
const stlaAnswered=i=>TODO_RULE.stla.includes(String(i.stla||'').toLowerCase())&&
  (TODO_RULE.jira[String(i.key).split('-')[0]]||[]).includes(String(i.status||'').toLowerCase());
const isPmTodo=i=>stlaAnswered(i)&&isPM(i.assignee);    // PM: copy the STLA reply into Jira
const isRdTodo=i=>stlaAnswered(i)&&!isPM(i.assignee);   // RD: answer the STLA reply (accept or reject)
const TABS={all:()=>true,pm:isPmTodo,rd:isRdTodo};
const inTab=i=>(TABS[tab]||TABS.all)(i);
const JIRA='https://'+((DATA&&DATA.site)||'mobiledrivetech.atlassian.net');

const T={
 zh:{token:'Token',update:'更新資料',lastUpdated:'資料更新時間：',colKey:'Jira ID',colSummary:'摘要',colExt:'External Link',colStla:'STLA 狀態',colAsg:'Assignee',unassigned:'未指派',tabAll:'全部',tabPm:'PM 待辦',stlaUp:'上傳 STLA 檔',u1:'讀取 STLA 檔案…',u2:(a,b,c)=>`檔案共 ${a} 筆，其中 ${b} 筆對應到清單（清單共 ${c} 個 External Link）`,u3:'上傳到 GitHub…',eStlaCols:h=>'找不到 Id / Status 欄位。目前欄位：'+h,eStlaNone:'檔案裡沒有任何 Id 對應到清單的 External Link',tabRd:'RD 待辦',pmAct:'→ PM：把 STLA 的回覆貼到 Jira',rdAct:'→ RD：回覆 STLA，決定接受或拒絕',pmRule:'<b>PM 待辦：</b>STLA 狀態為 Solution Proposed 或 RAR Rejected，且 Jira 狀態為 NR1LD「MD In Progress」或 NR1L「In Progress」，且 Assignee 是 Joseph / Amanda / Leyo / Lynn / Book。需要 PM 把 STLA 的資料貼到 Jira。',rdRule:'<b>RD 待辦：</b>STLA 狀態為 Solution Proposed 或 RAR Rejected，且 Jira 狀態為 NR1LD「MD In Progress」或 NR1L「In Progress」，且 Assignee 不是 Joseph / Amanda / Leyo / Lynn / Book（未指派也算）。需要 RD 針對 STLA 的回覆進行回答，決定接受或拒絕。',colSpec:'Other Specification',colStatus:'狀態',colCmt:'留言',cmt:'💬',send:'送出留言',namePh:'你的名字',textPh:'留言內容…',noCmt:'還沒有留言。',del:'刪除',delConfirm:'確定刪除？',saving:'儲存中…',saved:'已儲存 ✓',needName:'請先輸入名字',needTok:'要留言請先按右上角 🔑 Token 設定（只需一次）。',eTokenCm:'Token 沒有寫入權限（需要 Contents: Read and write）',eBusy:'太多人同時存檔，請再按一次',cmtHint:'留言會用你的 GitHub 帳號登入並記錄名字與時間（存在 marzlo/RAR 的 Discussions，公開可見）。',projAll:'張',cmtOff:'留言功能尚未啟用。',cmtHint2:'輸入你的名字和留言即可送出，不需要登入（名字由留言者自填）。',projOf:'待處理 / 進行中 / 已完成',
  search:'搜尋 Jira ID、摘要、外部編號、STLA 狀態或 Specification…',total:'總數',todo:'待處理',inprog:'進行中',done:'已完成',showing:(a,b)=>`顯示 ${a} / ${b}`,
  tokenPrompt:`請貼上 GitHub token（僅會存在你自己瀏覽器裡，不會傳給 GitHub 以外的地方）。<br><br>第一次使用請到 <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">建立 fine-grained token</a>：Repository access 只選 <b>${GH_REPO}</b>，Permissions 的 <b>Actions</b> 和 <b>Contents</b> 都設為 Read and write（Contents 是留言用），其他都不用給。`,
  ok:'確定',cancel:'取消',clear:'清除',tokenSet:'目前已設定 Token',tokenNone:'目前尚未設定 Token',
  p1:'送出更新要求…',p2:'排隊中，等待 GitHub 開始執行…',p3:'正在從 Jira 抓取資料並重建網頁…',p4:'完成！即將重新載入…',
  eFail:'更新沒有成功，請到 GitHub Actions 查看',eToken:'Token 無效或權限不足，請重新設定',eTimeout:'等太久了，請稍後重新整理頁面',eNet:'無法連線到 GitHub'},
 en:{token:'Token',update:'Update data',lastUpdated:'Data updated:',colKey:'Jira ID',colSummary:'Summary',colExt:'External Link',colStla:'STLA Status',colAsg:'Assignee',unassigned:'Unassigned',tabAll:'All',tabPm:'PM to-do',stlaUp:'Upload STLA file',u1:'Reading the STLA file…',u2:(a,b,c)=>`${a} rows in the file, ${b} match the list (${c} External Links on the list)`,u3:'Uploading to GitHub…',eStlaCols:h=>'Id / Status columns not found. Columns: '+h,eStlaNone:'No Id in the file matches an External Link on the list',tabRd:'RD to-do',pmAct:'→ PM: copy the STLA reply into Jira',rdAct:'→ RD: answer the STLA reply (accept or reject)',pmRule:'<b>PM to-do:</b> STLA status is Solution Proposed or RAR Rejected, the Jira status is NR1LD "MD In Progress" or NR1L "In Progress", and the assignee is Joseph / Amanda / Leyo / Lynn / Book. A PM needs to copy the STLA data into Jira.',rdRule:'<b>RD to-do:</b> STLA status is Solution Proposed or RAR Rejected, the Jira status is NR1LD "MD In Progress" or NR1L "In Progress", and the assignee is not Joseph / Amanda / Leyo / Lynn / Book (unassigned counts). RD needs to answer the STLA reply and decide to accept or reject.',colSpec:'Other Specification',colStatus:'Status',colCmt:'Comments',cmt:'💬',send:'Post comment',namePh:'Your name',textPh:'Comment…',noCmt:'No comments yet.',del:'Delete',delConfirm:'Delete?',saving:'Saving…',saved:'Saved ✓',needName:'Please enter your name',needTok:'To comment, set your 🔑 Token (top right) once.',eTokenCm:'The token cannot write to the repo (needs Contents: Read and write)',eBusy:'Too many saves at once; press again',cmtHint:'Comments sign in with your GitHub account and record your name and time (stored in marzlo/RAR Discussions, publicly visible).',projAll:'issues',cmtOff:'Comments are not enabled yet.',cmtHint2:'Enter your name and comment to post; no sign-in needed (names are self-reported).',projOf:'To Do / In Progress / Done',
  search:'Search Jira ID, summary, external ID, STLA status or specification…',total:'Total',todo:'To Do',inprog:'In Progress',done:'Done',showing:(a,b)=>`Showing ${a} / ${b}`,
  tokenPrompt:`Paste a GitHub token (stored only in your own browser, sent nowhere except GitHub).<br><br>First time: <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">create a fine-grained token</a>, set Repository access to <b>${GH_REPO}</b> only and both <b>Actions</b> and <b>Contents</b> to Read and write (Contents is for comments). Nothing else is needed.`,
  ok:'OK',cancel:'Cancel',clear:'Clear',tokenSet:'A token is currently set',tokenNone:'No token set',
  p1:'Sending the update request…',p2:'Queued, waiting for GitHub to start…',p3:'Fetching Jira and rebuilding the page…',p4:'Done! Reloading…',
  eFail:'The update did not succeed; check GitHub Actions',eToken:'The token is invalid or lacks permission; set it again',eTimeout:'This is taking too long; reload the page later',eNet:'Cannot reach GitHub'}
};
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}}};
let lang=new URL(location.href).searchParams.get('lang')||store.get('rar-lang')||'zh';
const t=k=>T[lang][k];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const data=DATA||{issues:[]};
let active=new Set(),sortK='status',sortDir=1,projF=null,catF=null,tab=({'#pm':'pm','#rd':'rd'})[location.hash]||'all';
const projOf=k=>String(k).split('-')[0];

function fmt(iso){return iso?new Date(iso).toLocaleString(lang==='zh'?'zh-TW':'en-US',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}):'—'}
function applyLang(){
  document.documentElement.lang=lang==='zh'?'zh-Hant':'en';
  document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));
  document.querySelectorAll('[data-html]').forEach(el=>el.innerHTML=t(el.dataset.html));
  $('btnLang').textContent=lang==='zh'?'EN':'中文';
  $('q').placeholder=t('search');
  $('cmName').placeholder=t('namePh'); $('cmText').placeholder=t('textPh');
  renderAll();
}
function renderAll(){
  const all=data.issues;
  $('sub').innerHTML=`Jira filter <a href="${JIRA}/issues?filter=${FILTER}" target="_blank" rel="noopener">${FILTER}</a>`;
  $('updatedAt').textContent=fmt(data.generated);
  const cat=c=>all.filter(i=>i.category===c).length;
  $('kpis').innerHTML=[[t('total'),all.length,''],[t('todo'),cat('new'),'new'],[t('inprog'),cat('indeterminate'),'indeterminate'],[t('done'),cat('done'),'done']]
    .map(([l,v,c])=>`<div class="kpi click${(c?catF===c:!catF&&!projF)?' on':''}" data-cat="${c}"><b>${v}</b><span>${l}</span></div>`).join('');
  $('projs').innerHTML=PROJECTS.map(p=>{
    const its=all.filter(i=>projOf(i.key)===p), c=k=>its.filter(i=>i.category===k).length;
    return `<div class="kpi click${projF===p?' on':''}" data-proj="${p}"><b>${p} · ${its.length}</b><span class="sub2">${t('projOf')}: ${c('new')} / ${c('indeterminate')} / ${c('done')}</span></div>`;
  }).join('');
  const counts={};all.filter(i=>inTab(i)&&(!projF||projOf(i.key)===projF)&&(!catF||i.category===catF)).forEach(i=>counts[i.status]=(counts[i.status]||0)+1);
  [...active].forEach(s=>{if(!counts[s])active.delete(s)});
  $('chips').innerHTML=Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([s,n])=>`<button class="chip${active.has(s)?' on':''}" data-s="${esc(s)}">${esc(s)} (${n})</button>`).join('');
  const nPm=all.filter(isPmTodo).length, nRd=all.filter(isRdTodo).length;
  document.querySelector('[data-tab=all]').textContent=`${t('tabAll')} (${all.length})`;
  document.querySelector('[data-tab=pm]').innerHTML=`${t('tabPm')} <span class="badge${nPm?'':' zero'}">${nPm}</span>`;
  document.querySelector('[data-tab=rd]').innerHTML=`${t('tabRd')} <span class="badge${nRd?'':' zero'}">${nRd}</span>`;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  $('todoInfo').style.display=tab==='all'?'none':'';
  $('todoInfo').innerHTML=tab==='pm'?t('pmRule'):tab==='rd'?t('rdRule'):'';
  render();
}
function render(){
  const all=data.issues, q=$('q').value.trim().toLowerCase();
  const rows=all.filter(i=>inTab(i)&&(!projF||projOf(i.key)===projF)&&(!catF||i.category===catF)&&(!active.size||active.has(i.status))&&(!q||(i.key+' '+i.summary+' '+(i.extId||'')+' '+(i.stla||'')+' '+(i.spec||'')+' '+(i.assignee||'')).toLowerCase().includes(q)))
    .sort((a,b)=>sortDir*String(a[sortK]??'').localeCompare(String(b[sortK]??''),undefined,{numeric:true}));
  $('count').textContent=t('showing')(rows.length,all.length);
  $('rows').innerHTML=rows.map(i=>`<tr>`+
    `<td><a href="${JIRA}/browse/${esc(i.key)}" target="_blank" rel="noopener">${esc(i.key)} ↗</a></td>`+
    `<td>${esc(i.summary)}${tab!=='all'?`<div class="todohint">${t(tab==='pm'?'pmAct':'rdAct')}</div>`:''}</td>`+
    `<td><span class="st ${esc(i.category)}">${esc(i.status)}</span></td>`+
    `<td class="asg">${i.assignee?esc(i.assignee):'<span class="dash">'+t('unassigned')+'</span>'}</td>`+
    `<td>${i.ext?`<a href="${esc(i.ext)}" target="_blank" rel="noopener">${esc(i.extId)} ↗</a>`:'<span class="dash">—</span>'}</td>`+
    `<td>${i.stla?`<span class="st stla">${esc(i.stla)}</span>`:'<span class="dash">—</span>'}</td>`+
    `<td class="spec">${i.spec?esc(i.spec):'<span class="dash">—</span>'}</td>`+
    `<td><button class="cbtn${cmList(i.key).length?' has':''}" data-c="${esc(i.key)}">${t('cmt')}${cmList(i.key).length?' '+cmList(i.key).length:''}</button></td></tr>`).join('');
}
function prog(pct,key,state){
  const p=$('prog');p.classList.add('show');p.classList.toggle('err',state==='err');p.classList.toggle('ok',state==='ok');
  $('progFill').style.width=pct+'%';$('progPct').textContent=Math.round(pct)+'%';$('progMsg').textContent=t(key);
}

/* ---- token ---- */
let memToken='';
const getToken=()=>store.get(TOKEN_KEY)||memToken;
const setToken=v=>{memToken=v;store.set(TOKEN_KEY,v)};
function refreshTokenBtn(){$('btnToken').classList.toggle('ok',!!getToken())}
function openToken(){$('tokenInput').value='';$('tokenState').textContent=getToken()?t('tokenSet'):t('tokenNone');$('dlgToken').showModal()}
$('btnToken').onclick=openToken;
$('tokenCancel').onclick=()=>$('dlgToken').close();
$('tokenClear').onclick=()=>{setToken('');refreshTokenBtn();$('dlgToken').close()};
$('tokenOk').onclick=()=>{const v=$('tokenInput').value.trim();if(v)setToken(v);refreshTokenBtn();$('dlgToken').close();if(v&&pendingUpdate){pendingUpdate=false;triggerRefresh()}};
$('tokenInput').onkeydown=e=>{if(e.key==='Enter')$('tokenOk').click()};

/* ---- update: run the GitHub Actions workflow and wait for it, staying on this page ---- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const gh=(path,opt={})=>fetch(`https://api.github.com/repos/${GH_REPO}${path}`,{...opt,cache:'no-store',headers:{'Accept':'application/vnd.github+json','Authorization':`Bearer ${getToken()}`}});
let pendingUpdate=false;
async function triggerRefresh(){
  const btn=$('btnUpdate');btn.disabled=true;
  try{
    prog(5,'p1');
    const since=Date.now()-60000;
    let r;
    try{r=await gh(`/actions/workflows/${GH_WF}/dispatches`,{method:'POST',body:JSON.stringify({ref:'main'})})}
    catch(e){prog(100,'eNet','err');return}
    if([401,403,404].includes(r.status)){prog(100,'eToken','err');pendingUpdate=true;openToken();return}
    if(!r.ok){prog(100,'eFail','err');return}
    prog(10,'p2');
    let started=0;
    for(let i=0;i<72;i++){                    // up to ~6 minutes
      await sleep(5000);
      let run;
      try{
        const res=await gh(`/actions/workflows/${GH_WF}/runs?event=workflow_dispatch&per_page=5`);
        if(!res.ok)continue;
        run=(await res.json()).workflow_runs.find(w=>new Date(w.created_at).getTime()>=since);
      }catch(e){continue}
      if(!run){prog(Math.min(20,10+i),'p2');continue}
      if(run.status!=='completed'){
        if(run.status==='in_progress'){started=started||Date.now();prog(Math.min(90,25+(Date.now()-started)/1000*1.2),'p3')}
        else prog(20,'p2');
        continue;
      }
      if(run.conclusion!=='success'){prog(100,'eFail','err');return}
      prog(95,'p4','ok');
      await sleep(12000);                     // give GitHub Pages a moment to publish
      prog(100,'p4','ok');
      const u=new URL(location.href);u.searchParams.set('r',Date.now());location.replace(u);
      return;
    }
    prog(100,'eTimeout','err');
  }finally{btn.disabled=false}
}
/* ---- upload the STLA prsse export (CSV / tab-separated / Excel) -> scripts/prsse.json -> rebuild ---- */
function parseDelimited(text,delim){
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true; else if(c===delim){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x!==''))rows.push(row);row=[]}
    else f+=c}
  row.push(f);if(row.some(x=>x!==''))rows.push(row);return rows;
}
async function readStlaRows(file){
  if(/\.xlsx?$/i.test(file.name)){
    if(!window.XLSX)await new Promise((ok,no)=>{const x=document.createElement('script');x.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';x.onload=ok;x.onerror=()=>no(new Error('Excel reader failed to load'));document.head.appendChild(x)});
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
    return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''});
  }
  const buf=new Uint8Array(await file.arrayBuffer());
  const enc=buf[0]===0xFF&&buf[1]===0xFE?'utf-16le':buf[0]===0xFE&&buf[1]===0xFF?'utf-16be':'utf-8';
  const text=new TextDecoder(enc).decode(buf);
  const first=text.split(/\r?\n/,1)[0];
  return parseDelimited(text,first.includes('\t')?'\t':',');
}
function stlaItems(rows){
  const h=(rows[0]||[]).map(x=>String(x).trim().toLowerCase());
  const iId=h.indexOf('id'), iSt=h.indexOf('status'), iSp=h.indexOf('other specification');
  if(iId<0||iSt<0)throw new Error(t('eStlaCols')(rows[0]?rows[0].slice(0,9).join(', '):''));
  const clean=v=>String(v??'').replace(/[\u200b-\u200f\ufeff]/g,'').replace(/\s+/g,' ').trim();
  const used=new Set(data.issues.map(i=>i.extId).filter(x=>/^\d+$/.test(x)));   // keep only ids the dashboard shows
  const items={}; let total=0;
  rows.slice(1).forEach(r=>{const id=clean(r[iId]);if(!id)return;total++;if(used.has(id))items[id]={status:clean(r[iSt]),spec:iSp>=0?clean(r[iSp]):''}});
  return {items,total,used:used.size};
}
async function uploadStla(file){
  const btn=$('btnStla');btn.disabled=true;
  try{
    prog(5,'u1');
    const rows=await readStlaRows(file);
    const {items,total,used}=stlaItems(rows);
    const n=Object.keys(items).length;
    if(!n)throw new Error(t('eStlaNone'));
    $('progMsg').textContent=t('u2')(total,n,used);
    const json={imported:new Date().toISOString().slice(0,10),source:file.name+' (uploaded from the dashboard)',note:'Only the IDs used by the dashboard.',items};
    prog(25,'u3');
    const since=Date.now()-60000;
    const path='scripts/prsse.json';
    const cur=await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${path}?ref=main`,{cache:'no-store',headers:{'Accept':'application/vnd.github+json','Authorization':`Bearer ${getToken()}`}});
    const body={message:`Update STLA status from ${file.name}`,content:encB64(JSON.stringify(json,null,1)+'\n'),branch:'main'};
    if(cur.ok)body.sha=(await cur.json()).sha;
    const r=await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${path}`,{method:'PUT',headers:{'Accept':'application/vnd.github+json','Authorization':`Bearer ${getToken()}`,'Content-Type':'application/json'},body:JSON.stringify(body)});
    if([401,403,404].includes(r.status)){prog(100,'eTokenCm','err');openToken();return}
    if(!r.ok)throw new Error('GitHub HTTP '+r.status);
    // show the new STLA columns right away; the rebuilt page follows
    data.issues.forEach(i=>{const p=items[i.extId];if(p){i.stla=p.status;i.spec=p.spec}});renderAll();
    prog(40,'p2');
    for(let k=0;k<72;k++){
      await sleep(5000);
      let run;
      try{const res=await gh(`/actions/workflows/${GH_WF}/runs?event=push&per_page=5`);if(!res.ok)continue;
          run=(await res.json()).workflow_runs.find(w=>new Date(w.created_at).getTime()>=since)}catch(e){continue}
      if(!run){prog(Math.min(45,40+k),'p2');continue}
      if(run.status!=='completed'){prog(run.status==='in_progress'?Math.min(90,50+k*2):45,'p3');continue}
      if(run.conclusion!=='success'){prog(100,'eFail','err');return}
      prog(95,'p4','ok');await sleep(12000);prog(100,'p4','ok');
      const u=new URL(location.href);u.searchParams.set('r',Date.now());location.replace(u);return;
    }
    prog(100,'eTimeout','err');
  }catch(e){prog(100,'eNet','err');$('progMsg').textContent=e.message||String(e)}
  finally{btn.disabled=false;$('stlaFile').value=''}
}
$('btnStla').onclick=()=>{ if(!getToken()){openToken();return} $('stlaFile').click() };
$('stlaFile').onchange=()=>{ const f=$('stlaFile').files[0]; if(f)uploadStla(f) };
$('btnUpdate').onclick=()=>{ if(getToken())triggerRefresh(); else {pendingUpdate=true;openToken()} };

$('kpis').onclick=e=>{const k=e.target.closest('.kpi');if(!k)return;const c=k.dataset.cat;catF=(!c||catF===c)?null:c;if(!c)projF=null;renderAll()};
$('projs').onclick=e=>{const k=e.target.closest('.kpi');if(!k)return;const p=k.dataset.proj;projF=projF===p?null:p;renderAll()};
/* ---- comments: stored in comments.json in this repo (same idea as CPAA_Dash) ---- */
const CM_PATH='comments.json', NAME_KEY='rar-name';
let CM=(DATA&&DATA.comments)||{comments:{}}; if(!CM.comments)CM.comments={};
let cmKey=null;
const cmList=k=>CM.comments[k]||[];
const fmtT=iso=>new Date(iso).toLocaleString(lang==='zh'?'zh-TW':'en-US',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
const decB64=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g,'')),c=>c.charCodeAt(0)));
const encB64=s=>{const b=new TextEncoder().encode(s);let o='';for(let i=0;i<b.length;i+=0x8000)o+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(o)};
async function cmFetch(){            // latest comments.json straight from the repo (no rebuild needed)
  const h={'Accept':'application/vnd.github+json'}; if(getToken())h.Authorization=`Bearer ${getToken()}`;
  const r=await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${CM_PATH}?ref=main`,{cache:'no-store',headers:h});
  if(r.status===404)return {sha:null,json:{comments:{}}};
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json(); const json=JSON.parse(decB64(j.content)); if(!json.comments)json.comments={};
  return {sha:j.sha,json};
}
async function cmRefresh(){try{const {json}=await cmFetch();CM=json;render();if(cmKey)cmRender()}catch(e){}}
async function cmSave(mutate){       // read-modify-write with retry, so two people saving at once both land
  for(let i=0;i<4;i++){
    const {sha,json}=await cmFetch(); mutate(json); json.updated_at=new Date().toISOString(); json.updated_by=$('cmName').value.trim();
    const body={message:`Comment on ${cmKey} by ${json.updated_by}`,content:encB64(JSON.stringify(json,null,1)+'\n'),branch:'main'}; if(sha)body.sha=sha;
    const r=await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${CM_PATH}`,{method:'PUT',headers:{'Accept':'application/vnd.github+json','Authorization':`Bearer ${getToken()}`,'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(r.ok){CM=json;return}
    if([401,403,404].includes(r.status))throw new Error(t('eTokenCm'));
    if(r.status!==409&&r.status!==422)throw new Error('HTTP '+r.status);
    await sleep(800);
  }
  throw new Error(t('eBusy'));
}
function cmRender(){
  const items=cmList(cmKey), me=store.get(NAME_KEY)||'';
  $('cmList').innerHTML=items.length?items.map(c=>`<div class="cmitem"><div class="meta"><b>${esc(c.by)}</b><span>${esc(fmtT(c.at))}</span>${c.by===me?`<button class="del" data-id="${esc(c.id)}">${t('del')}</button>`:''}</div><div class="txt">${esc(c.text)}</div></div>`).join(''):`<div class="hint">${t('noCmt')}</div>`;
}
function openComments(key){
  cmKey=key; const it=data.issues.find(i=>i.key===key)||{};
  $('cmKey').innerHTML=`<a href="${JIRA}/browse/${esc(key)}" target="_blank" rel="noopener">${esc(key)} ↗</a>`;
  $('cmSum').textContent=it.summary||'';
  $('cmName').value=store.get(NAME_KEY)||''; $('cmText').value=''; $('cmMsg').textContent=getToken()?'':t('needTok');
  cmRender(); $('dlgCmt').showModal(); cmRefresh();
}
$('cmSend').onclick=async()=>{
  const name=$('cmName').value.trim(), text=$('cmText').value.trim();
  if(!name){$('cmMsg').textContent=t('needName');$('cmName').focus();return}
  if(!text){$('cmText').focus();return}
  if(!getToken()){$('cmMsg').textContent=t('needTok');openToken();return}
  store.set(NAME_KEY,name); $('cmSend').disabled=true; $('cmMsg').textContent=t('saving');
  const c={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),text,by:name,at:new Date().toISOString()};
  try{await cmSave(j=>{(j.comments[cmKey]=j.comments[cmKey]||[]).push(c)});$('cmText').value='';$('cmMsg').textContent=t('saved');cmRender();render()}
  catch(e){$('cmMsg').textContent=e.message}
  finally{$('cmSend').disabled=false}
};
$('cmList').onclick=async e=>{
  const b=e.target.closest('.del'); if(!b||!getToken())return;
  if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent=t('delConfirm');return}
  try{await cmSave(j=>{j.comments[cmKey]=(j.comments[cmKey]||[]).filter(c=>c.id!==b.dataset.id)});cmRender();render()}catch(err){$('cmMsg').textContent=err.message}
};
$('rows').onclick=e=>{const b=e.target.closest('.cbtn');if(b)openComments(b.dataset.c)};
$('cmClose').onclick=()=>$('dlgCmt').close();
$('dlgCmt').addEventListener('close',()=>{cmKey=null});
$('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.tab;history.replaceState(null,'',tab==='all'?location.pathname+location.search:'#'+tab);renderAll()};
$('q').oninput=render;
$('chips').onclick=e=>{const s=e.target.dataset.s;if(!s)return;active.has(s)?active.delete(s):active.add(s);e.target.classList.toggle('on');render()};
document.querySelector('thead').onclick=e=>{const k=e.target.dataset.k;if(!k)return;sortDir=(sortK===k)?-sortDir:1;sortK=k;render()};
$('btnLang').onclick=()=>{lang=lang==='zh'?'en':'zh';store.set('rar-lang',lang);applyLang()};
applyLang(); refreshTokenBtn();
</script>
